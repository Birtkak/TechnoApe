# The TechnoApe server on the Unraid box (ADR 0145). Host networking so the game port and the
# discovery port are reachable on the box's Tailscale address; /data keeps the world between restarts.
#   docker compose -f deploy/compose.yml up -d --build
services:
  technoape-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: technoape-server:latest
    container_name: technoape-server
    network_mode: host
    restart: unless-stopped
    environment:
      SEED: "1337"
      PORT: "7777"
      GAMEMODE: survival
      SERVER_NAME: Tower
    volumes:
      - /mnt/user/appdata/technoape/data:/data
