# A draft snake (Claude's, listed in data/drafts.txt): a chain of parts for the snake plan of
# data/creatures.toml (ADR 0053), facing +z. Each part is the child of the one before it, so the walk's wave
# runs from the head down. Format: docs/design/studio-tools.md "Models".
colours = ["grass dark", "grass", "grass light"]

[[part]]
name = "head"
parent = ""
at = [3, 0, 6]
pivot = [1, 1, 0]
box = [2, 2, 2]
voxels = """
bb
bb

cc
bb
"""

[[part]]
name = "neck"
parent = "head"
at = [0, 0, -2]
pivot = [1, 1, 2]
box = [2, 2, 2]
voxels = """
aa
bb

bb
aa
"""

[[part]]
name = "middle"
parent = "neck"
at = [0, 0, -2]
pivot = [1, 1, 2]
box = [2, 2, 2]
voxels = """
bb
aa

aa
bb
"""

[[part]]
name = "tail"
parent = "middle"
at = [0, 0, -2]
pivot = [1, 1, 2]
box = [2, 1, 2]
voxels = """
ab
ba
"""
