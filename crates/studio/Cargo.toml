[package]
name = "studio"
version = "0.1.0"
edition = "2021"
description = "TechnoApe Studio: paints the game's textures from its one palette (docs/design/studio.md, ADR 0046)"

[[bin]]
name = "technoape-studio"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
# the game as a library: its mixer and sound rows, its effects rows (ADR 0048, 0050)
client = { path = "../client" }
toml = "0.8"
glam.workspace = true
# the workspace's own wgpu 30 and winit 0.30 (ADR 0046): egui only here, never in the game
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui-wgpu = "0.37"
wgpu = "30"
pollster = "1"
png = "0.18"
