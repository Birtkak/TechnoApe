[workspace]
members = ["crates/engine", "crates/client", "crates/server", "crates/bot", "crates/studio"]
resolver = "2"

[workspace.dependencies]
glam = { version = "0.34", features = ["serde"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Hand-over builds (tools/playtest.sh): release's speed without fat LTO's minutes of linking. Every
# performance number still comes from `release`.
[profile.play]
inherits = "release"
lto = false
codegen-units = 16

# The bake's air runs a year even on the tests' small planets (W3): unoptimised it took minutes. Floats
# give the same bits at any opt-level (no fast-math), so this changes speed only.
[profile.test.package.engine]
opt-level = 2
