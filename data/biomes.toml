# Terra's biomes and still plants (ADR 0042, 0043; schema and checks in crates/engine/src/biomes.rs).
# The biome rows are the bake's biomes in its order (crates/engine/src/bake/life.rs, ICE .. REEF): never
# reorder them. Looks accepted by the developer on 2026-11-11; every number here is open to taste.
#
# A biome: `top` the block at the surface, `band` the blocks under it to 4 m, `rock` below.
# `patches`: [block, share] pairs: that share of the surface (in clumps of a few metres) is that block
# instead of `top`. `snow_over`: the top is snow from this height over the sea (metres) up.
# `plants`: [plant, share] pairs: the share of the candidate spots (one every 4 x 4 columns, jittered)
# that grow that plant; the shares add up to at most 1.
#
# A plant (generated as plain blocks; they do not grow, living plants are W7): `shape` cone (a layered
# conifer: tiers of clumps on limbs with gaps between, bare under `bare`), round (a trunk that forks at
# `fork` of its height into `limbs` limbs, each spreading into branches under a dome of leaves `depth`
# blocks thick each way; `thick`: a large one stands on a 2 x 2 trunk), flat (the same with a flat top: the
# savanna's), droop (a willow: a flatter cap and curtains of leaves hanging to the ground), palm (fronds on a
# bare trunk), column (a cactus, a reed: `trunk` only; with `leaves` and a radius, a clump of stalks:
# bamboo), bush (`leaves` only). `height`: [lowest, highest] in blocks; a tree is small, medium or large by
# where its height falls in that range, and its crown is 2, 1 or 0 blocks narrower than `radius` (0..6).
# `warm`: it grows only where the year's mean air is at least this, C (ADR 0092).
# The plant rows may be reordered; new ones go at the end (ADR 0092).

[[plant]]
name = "spruce"
shape = "cone"
trunk = "log"
leaves = "spruce leaves"
height = [7, 14]
radius = 3
bare = 0.15

[[plant]]
name = "broadleaf"
shape = "round"
trunk = "log"
leaves = "broadleaf leaves"
height = [5, 9]
radius = 4
fork = 0.4
limbs = 3

