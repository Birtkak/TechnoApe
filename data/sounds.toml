# The sounds (docs/design/sound.md; schema and checks in crates/client/src/audio.rs).
# A row is made in code from its layers, unless a recording of its name lies in data/sounds/:
# `dig.stone.wav`, or `dig.stone.1.wav`, `dig.stone.2.wav`... for several takes (WAV; the row's `gain`,
# `reach` and `pitch` still apply).
# `bus`: whose volume slider it follows (world, steps, ui). `reach`: metres at which it is gone (24).
# `gain`: its loudest sample (1). `variants`: how many takes are made (1). `pitch`: the share each play's
# pitch varies by (0). `loop`: seconds of a sound that goes round.
# A layer: `wave` (noise through a band-pass filter, sine, triangle, square), `freq` in Hz at its start and
# its end, `q` how narrow a noise's filter is (1), `attack` (0.002 s) and `decay` (seconds to fall to a
# thousandth), `gain` among the layers (1), `delay` (0 s).
# A block's `sound` in data/blocks.toml names a family: it needs dig.<it>, place.<it> and step.<it>.
# A footstep is a heel and, a moment later, a toe; eight takes, and no take plays twice running.
# A landing is a step; from two blocks up `land` thumps with it, louder and lower the further the fall.
# In a loop a layer with a `decay` is a note: it starts at its `delay` and rings round the loop's end.
#
# Bases and chains (ADR 0048). A row is made from `layer`s or `from` bases, not both:
#   from = [{ base = "base.thud", gain = 1.0, delay = 0.0 }, ...]
# a base is a row by name (any row; the `base.*` rows are made for it) or else a recording
# data/sounds/base/<base>.wav. Take k of the row is made from take k of each base (round their own count).
# In a loop a base that is a loop fills it, one that is not plays once at its delay and rings round.
# No row is made from itself, directly or through others. Then, for layers or bases, a `chain` of steps in
# turn, each a table whose step key holds its first number, the others by name (defaults in brackets):
#   pitch (semitones, length kept), speed (times as fast, pitch kept), stretch (times as long, pitch with it),
#   lowpass / highpass / bandpass (Hz; q 0.707, bandpass 1), reverb (size 0..1: rings 0.3 to 4 s; damping 0.5,
#   mix 0.3), echo (seconds; feedback 0.3, mix 0.5), drive (amount 0..20), tremolo (rate Hz; depth 0..1, 0.5),
#   vibrato (rate Hz; depth semitones, 0.3), fade (in seconds; out 0), trim (start seconds; end 0 = to the end),
#   reverse = true, gain (times), crush (bits 1..16).
#   chain = [{ pitch = -5 }, { lowpass = 3500, q = 0.7 }, { reverb = 0.35, mix = 0.25 }]
# reverb and echo keep the sound as it was and add their tail after it. A loop's chain has no trim or fade.
# `spread`: how far each take's numbers stray, either way, in the numbers' own units; a step's name sets its
# first number's, a table under it any number's (every step of that kind in the chain):
#   spread = { pitch = 1.5, lowpass = 800, reverb = { mix = 0.1 } }
# Each take draws its own from the row's seed, so takes differ and a rebuild makes the same takes. A take's
# loudest sample is never past the row's `gain` (the mix of bases is set to it, the chain may lower it).
# A running game makes changed rows again within about a second of a save; a file that does not parse, or
# that drops a row, is refused by name and the old sounds play on.

# --- stone: a crack, a click and a thump ---
[[sound]]
name = "dig.stone"
bus = "world"
reach = 30
gain = 0.7
variants = 4
pitch = 0.1
layer = [
  { wave = "noise", freq = [2200, 900], q = 1.2, decay = 0.11 },
  { wave = "noise", freq = [5000, 4000], q = 0.8, decay = 0.012, gain = 0.8 },
  { wave = "sine", freq = [150, 70], decay = 0.07, gain = 0.6 },
  { wave = "noise", freq = [1400, 700], q = 2.0, decay = 0.05, gain = 0.4, delay = 0.06 },
]

