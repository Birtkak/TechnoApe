# The sounds (docs/design/sound.md; schema and checks in crates/client/src/audio.rs).
# A row is made in code from its layers, unless a recording of its name lies in data/sounds/:
# `dig.stone.wav`, or `dig.stone.1.wav`, `dig.stone.2.wav`... for several takes (WAV; the row's `gain`,
# `reach` and `pitch` still apply).
# `bus`: whose volume slider it follows (world, steps, ui). `reach`: metres at which it is gone (24).
# `gain`: its loudest sample (1). `variants`: how many takes are made (1). `pitch`: the share each play's
# pitch varies by (0). `loop`: seconds of a sound that goes round.
# A layer: `wave` (noise through a band-pass filter, sine, triangle, square), `freq` in Hz at its start and
# its end, `q` how narrow a noise's filter is (1), `attack` (0.002 s) and `decay` (seconds to fall to a
# thousandth), `gain` among the layers (1), `delay` (0 s).
# A block's `sound` in data/blocks.toml names a family: it needs dig.<it>, place.<it> and step.<it>.
# A footstep is a heel and, a moment later, a toe; eight takes, and no take plays twice running.
# A landing is a step; from two blocks up `land` thumps with it, louder and lower the further the fall.
# In a loop a layer with a `decay` is a note: it starts at its `delay` and rings round the loop's end.

# --- stone: a crack, a click and a thump ---
[[sound]]
name = "dig.stone"
bus = "world"
reach = 30
gain = 0.7
variants = 4
pitch = 0.1
layer = [
  { wave = "noise", freq = [2200, 900], q = 1.2, decay = 0.11 },
  { wave = "noise", freq = [5000, 4000], q = 0.8, decay = 0.012, gain = 0.8 },
  { wave = "sine", freq = [150, 70], decay = 0.07, gain = 0.6 },
  { wave = "noise", freq = [1400, 700], q = 2.0, decay = 0.05, gain = 0.4, delay = 0.06 },
]

[[sound]]
name = "place.stone"
bus = "world"
gain = 0.6
variants = 3
pitch = 0.08
layer = [
  { wave = "sine", freq = [190, 90], decay = 0.06 },
  { wave = "noise", freq = [1800, 1200], q = 1.5, decay = 0.03, gain = 0.6 },
]

[[sound]]
name = "step.stone"
bus = "steps"
reach = 16
gain = 0.3
variants = 8
pitch = 0.12
layer = [
  { wave = "noise", freq = [700, 350], q = 0.9, decay = 0.05 },
  { wave = "sine", freq = [95, 60], decay = 0.05, gain = 0.6 },
  { wave = "noise", freq = [1800, 1000], q = 1.2, decay = 0.035, gain = 0.45, delay = 0.085 },
  { wave = "noise", freq = [3500, 2500], q = 1.0, decay = 0.02, gain = 0.15, delay = 0.09 },
]

