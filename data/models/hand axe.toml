# A draft hand axe (Claude's, listed in data/drafts.txt; ADR 0110): a knapped flint, a teardrop standing point
# up with its butt in the fist: dark flint, a pale ridge between the flake scars up to the point, and the chalk
# rind left on the butt. The second row of each layer is the face the eye sees in hand (the first draft had its
# flakes on the far side). Shown at the in-hand scale of any model (a cell is 0.35 m there), so it is larger
# than life in voxels: about 22 by 35 cm on screen. For the Studio to repaint.
colours = ["flint r3", "flint r4", "flint r5", "flint r6", "limestone light", "pebble r8"]

[[part]]
name = "body"
box = [5, 8, 2]
voxels = """
.aea.
.eee.

aaeaa
beeec

aaaaa
bcdfb

aaaaa
cdfcb

aaaaa
bcfdc

.aaa.
.cfd.

.aaa.
.dfc.

..a..
..f..
"""
