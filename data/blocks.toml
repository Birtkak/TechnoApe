# The blocks (CLAUDE.md: content is data; schema and checks in crates/engine/src/blocks.rs).
# `id` goes on the wire and into saves: never change or reuse one. 0 is air.
# `pattern`: plain (three tones of noise), grass (a bright top; its sides are `side` with a grass fringe),
# stone (dark crack texels), and patterns with parts (ADR 0039; designed in tools/review/workbench.html):
# pebbles, speckle, frame, weave, planks, tiles, bricks, rings, leaves (holes, ADR 0069). Those paint `colour`, `colour2` and `colour3`
# (default a darker and a lighter `colour`) at `size` (1..8 texels) and `amount` (0..1), each pattern with
# its own defaults. `contrast` (0..2, default 1): how strong the three tones of grain are, on any block.
# `side`: a grass block's sides under the fringe; any other block takes that block's whole look on its four
# sides and its foot. `light`: the light it gives, a colour times its strength (0..4, ADR 0022).
# `joins`: side by side in a wall, its faces glow as one surface, the painted frame only on the outer edge
# (lamps, ADR 0085).
# `sound`: its material's sound, a family of rows in data/sounds.toml (stone when it names none).
# `metal`: how much it reflects like a metal (0..1). `was`: names it had before, so old saves still load.
# `hardness`: seconds a survival player digs it with bare hands (every solid block; ADR 0034). `loose`:
# bare hands take it, so it goes into the inventory; a block that is not loose breaks in its time and gives
# nothing until the tools that take it exist. `falls`: it falls when the cell under it opens and slides off a
# step of two or more, as a whole block (sand, gravel; ADR 0079). `soft`: sound passes it without an echo (leaves, a shrub, reed),
# so it is no wall to the cave reverb (ADR 0054). `see`: "cutout" for a block seen through, its pixels
# wholly there or wholly empty (alpha 0 in its painting; the `leaves` pattern has holes), opaque without it (ADR 0069).

