# The blocks (CLAUDE.md: content is data; schema and checks in crates/engine/src/blocks.rs).
# `id` goes on the wire and into saves: never change or reuse one. 0 is air.
# `pattern`: plain (three tones of noise), grass (a bright top; its sides are `side` with a grass fringe),
# stone (dark crack texels), and patterns with parts (ADR 0039; designed in tools/review/workbench.html):
# pebbles, speckle, frame, weave, planks, tiles, bricks, rings, leaves (holes, ADR 0069). Those paint `colour`, `colour2` and `colour3`
# (default a darker and a lighter `colour`) at `size` (1..8 texels) and `amount` (0..1), each pattern with
# its own defaults. `contrast` (0..2, default 1): how strong the three tones of grain are, on any block.
# `side`: a grass block's sides under the fringe; any other block takes that block's whole look on its four
# sides and its foot. `light`: the light it gives, a colour times its strength (0..4, ADR 0022).
# `joins`: side by side in a wall, its faces glow as one surface, the painted frame only on the outer edge
# (lamps, ADR 0085). `wood`: a tree grows from it (log, branches): a bare crown's twigs start at it (ADR 0090).
# `holds`: [item, chance]: a generated cell of it, never edited, gives that item too when dug in survival, by a
# roll from the seed and the cell (ADR 0097: flint in gravel).
# `sound`: its material's sound, a family of rows in data/sounds.toml (stone when it names none).
# `metal`: how much it reflects like a metal (0..1). `was`: names it had before, so old saves still load.
# `hardness`: seconds a survival player digs it with bare hands (every solid block; ADR 0034). `loose`:
# bare hands take it, so it goes into the inventory; a block that is not loose breaks in its time and gives
# nothing until the tools that take it exist. `tool` (every solid block; ADR 0110, items.md "Tools"): the kind
# that digs it in `hardness / speed` (axe, pick, shovel, hammer, knife; a tool's numbers are its head material's
# in data/items.toml). `grade` (0..4, 0 if left out): a block that is not loose drops itself only to that kind
# of tool of at least this grade (0 hands, 1 stone, 2 copper and bronze, 3 iron, 4 steel); rock still leaves its
# rubble. `later`: no tool of its grade can be made yet (the data test lets it wait). `falls`: it falls when the cell under it opens and slides off a
# step of two or more, as a whole block (sand, gravel; ADR 0079).
# `rubble`: rock and hard ore (ADR 0093, mining.md 4): a survival dig leaves `<name> rubble` in the cell, a block
# made from this row with that id (its colours in pebbles, loose, falling, 0.5 s by hand); digging the rubble
# takes it. Soil, sand, wood, leaves and loose ore name none and are taken as themselves. `stack`: how many
# make a full slot (1..64, 64 if left out; rock, rubble and ore 16). Ids 160..199 are kept for rubble.
# `bedding`: layered rock's metres between bedding planes; `joints`: massive rock's columns between joints, on
# average (ADR 0094, mining.md 2): a survival dig on one loosens its neighbours along it into rubble.
# `soft`: sound passes it without an echo (leaves, a shrub, reed),
# so it is no wall to the cave reverb (ADR 0054). `see`: "cutout" for a block seen through, its pixels
# wholly there or wholly empty (alpha 0 in its painting; the `leaves` pattern has holes), opaque without it (ADR 0069).
# `fluff` (a cutout block's, ADR 0090): the planes standing out of a plant, `size` (faces wide, 0..3; 0 none),
# `push` (metres out, 0..1.2), `droop` (metres down a metre out, 0..1.2), `long` (length over width along the way
# from the wood, 1..4), `dense` (the share of faces with one, 0..1) and `light` (the share of the sun one face lets
# through to a shadow, 0..1); unnamed ones are the broadleaf's 1.7, 0.35, 0, 1, 1, 0.5.

