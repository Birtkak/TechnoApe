# Items that are not blocks (ADR 0074, docs/design/items.md; schema and checks in crates/engine/src/items.rs).
# Every block kind is an item already, with its block id; these take ids from 0x8000 up in the order written
# here, and saves keep them by name, so a row may be added anywhere without breaking a save. Never rename one
# without a `was` (not needed yet: nothing has been renamed).
# `stack`: how many make a full slot (1..64, 64 if left out). `pack`: slots it opens when worn (packs only).
# `look`: the block whose colours it is drawn in, in a slot and lying in a pile, until items have pictures.
# shortcut: packs cannot be made yet (no recipes, crafting.md); /give hands them out.

# The creative screen's tabs (ADR 0075): ore takes every block data/minerals.toml names, rock every layer of
# data/rocks.toml, lamps every block that gives light, made the blocks listed here, nature the rest.
made = ["copper", "glass", "green glass", "amber glass"]

[[item]]
name = "basket"
stack = 1
pack = 9
look = "reed"

[[item]]
name = "hide pack"
stack = 1
pack = 18
look = "mud"

[[item]]
name = "frame pack"
stack = 1
pack = 27
look = "log"

# The first age's pick-ups (ADR 0082): they lie on the ground as clutter (data/clutter.toml) and are taken by hand.
[[item]]
name = "stick"
look = "log"

[[item]]
name = "loose stone"
look = "stone"

[[item]]
name = "flint"
stack = 16
look = "slate"
# knapping (ADR 0110): struck this many times on hard rock (a block a pick digs and hands do not take) with the
# place button in survival, one flint becomes the item named
knap = ["hand axe", 4]

# Tools (ADR 0110, items.md "Tools"): `tool` is the kind (axe, pick, shovel, hammer, knife, or "any": counts as
# every kind) and `head` its material, a [[material]] row whose numbers it digs by: `speed` (dig time is
# hardness / speed on a block whose `tool` is its kind; else the bare-hand time), `grade` (1 stone, 2 copper and
# bronze, 3 iron, 4 steel: it takes a block that is not loose of at most that grade) and `uses` (digs; a dig
# costs one, at none it is gone and leaves nothing). A tool stacks by one.
# shortcut: one material; hafted axes, picks and shovels (a head and a handle) wait for crafting.md's process
# runner, and may then haft this row's numbers up.
[[material]]
name = "flint"
speed = 2.0
grade = 1
uses = 40
# `prospect`: how far a prospecting strike with a tool of it hears ore, metres (ADR draft-ore-samples-and-prospecting;
# 0 or left out: it does not prospect; at most 64). The place button with a pick or an every-kind tool on rock.
prospect = 16

# The first tool: a flint knapped on rock (ADR 0110), unhafted, so every kind at once, slow and soon worn
[[item]]
name = "hand axe"
stack = 1
look = "slate"
tool = "any"
head = "flint"

[[item]]
name = "mushroom"
look = "coral"

[[item]]
name = "berries"
look = "coral"

# Ore samples (ADR draft-ore-samples-and-prospecting): loose bits lying on the ground over an ore body
# (data/minerals.toml `sample`, data/clutter.toml), taken by hand. They hold no metal.
# shortcut: samples are only a sign for now; nuggets become smeltable with the copper age's recipes.
[[item]]
name = "copper nugget"
stack = 16
look = "copper"

[[item]]
name = "tin pebble"
stack = 16
look = "cassiterite"

[[item]]
name = "iron pebble"
stack = 16
look = "hematite"

[[item]]
name = "coal lump"
stack = 16
look = "coal"

[[item]]
name = "lead pebble"
stack = 16
look = "galena"

[[item]]
name = "gold nugget"
stack = 16
look = "gold quartz"

[[item]]
name = "pitchblende pebble"
stack = 16
look = "pitchblende"
