# The journal (docs/design/journal.md, draft ADR journal-data; schema and checks in crates/engine/src/journal.rs).
# DRAFTS: these entries and their words are Claude's first try at the things the game has today, to be
# rewritten with the starter's entries (journal.md, step 4).
#
# An entry is unknown, noticed (the player sees its question) or known (its text). A trigger in `noticed_by`
# notices it, one in `known_by` makes it known; a known entry notices every entry it `points_at`.
# Triggers so far:
#   look:block:<block>   the crosshair is on that block (data/blocks.toml), looked at twice a second
#   have:<item>          that block or item (data/items.toml) is in the ape's slots
# `do:`, `see:` and `need:` come with the process runner (journal.md, step 4).
# `age`: the age it belongs to (docs/design/progression.md): steam, lv, mv, hv, ev, iv or exotic.
# Saves keep each ape's entries by name. A save's entry this file does not have (renamed, a typo) is kept
# aside, unseen, and saved again; named so here again, it is found with its state. A rename therefore starts
# every ape over on that entry unless the old name comes back.

[[entry]]
name = "flint"
age = "steam"
title = "Flint"
question = "A grey stone with a glassy skin. It rings when struck."
text = "Flint breaks into edges sharper than any other stone. Struck with another stone, it can be shaped."
known_by = ["have:flint"]
points_at = ["hand-axe"]

[[entry]]
name = "hand-axe"
age = "steam"
title = "Hand axe"
question = "Struck the right way, could a flint hold an edge?"
text = "A flint struck on a stone until one side is a blade: it cuts wood and digs faster than bare hands."
known_by = ["have:hand axe"]

[[entry]]
name = "plant-fibre"
