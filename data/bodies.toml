# The bodies (fundamentals section 2: bodies are data; schema and checks in crates/engine/src/bodies.rs).
# A row's place is the body's index: on the wire, in saves and in every frame. Never reorder rows.
# `n`: columns per face edge by default, each a 1 m block wide (ADR 0033): 6144 is the 4 km planet
# `n` again: (planet= and moon= on the command line override it; ADR 0021).
# `generator`: continents (ADR 0021's land and sea) or hills (noise only). `ground`: the top, the band under
# it and the rock below, by block name. `air`: the sky's colour and the air's thinning (ADR 0022).
# `since`: the first world generation it is in (0 if left out: every world; a row goes at the end and is never
# older than the one above, so a world of an older generation has the rows above it, `bodies::of`).
# `parent`: what it circles, "sun" or a row above it (0163-n-bodies). `home` (the first row, and only it): the
# home world, whose are the spawn, the ore, the weather, the tide and the herds. `stages`: the bake that makes its
# map, its stages in the order they run (0165-bake-stages; crates/engine/src/bake/mod.rs `check` says what
# each needs before it): a crust, "plates" (Terra's, ADR 0043) or "crust" (an old crust without plates, Luna's,
# ADR 0070), then "erosion", "climate", "ice", "life" on plates, or "impacts", "ice", "volcanism" on a crust;
# none: the seed's noise alone.
# `orbit` (a moon): how far out it circles its parent, centre to centre in the parent's radii, and never nearer
# than `orbit_min` metres. `words`: what /goto also accepts.
# `size` (not the home body): the home body's radius over this one's, which sets its columns from the
# home's (`bodies::columns`), instead of `n`. `sun` (a body that circles the sun): the sun's distance in its
# radii. The sun's size follows from the home's first moon: seen from the home's ground under it, it just
# covers the sun, so every total eclipse is a perfect one (sky.rs `Sky::new`, ADR 0041).
# `day` (a body that circles the sun, not home): its sidereal day in the home's days; none: it does not turn.
# `colour`: its point of light's when its disc is under a pixel (sky.rs `point_light`; grey if left out).
# What a body is made of (planet-model.md; its interior, crates/engine/src/interior.rs, is derived from these and
# its radius): `kind` rocky, icy or gas (a gas row has no `ground`, `generator` or `stages`, and its `iron`, `heat`
# and `density` are its conducting fluid's, as its row says; an icy row's are a rock core's under ice and rock, and
# its crust bakes on ice, bake/icy.rs); `iron` the metal core's radius over the body's;
# `heat` how hot the inside still is, 0 dead (the core all solid) to 1 young (all liquid), the solid inner core's
# radius being 1 - heat of the core's; `density` the crust's rock, the mantle's and the core's metal, kg/m3.
# `[body.old]`: its `iron`, `density` and `weight_g` (the pull its rock was weighed with) in the worlds before real
# gravity (generation 8, ADR 0180), where they were not its own. `sun_density` (the home's row): the sun's, kg/m3.

[[body]]
name = "Terra"
parent = "sun"
home = true
stages = ["plates", "erosion", "climate", "ice", "life"]
words = ["home", "spawn"]
n = 6144
generator = "continents"
ground = ["grass", "dirt", "stone"]
air = true
# its point of light far off: the blue of its seas and air
colour = [0.55, 0.72, 1.0]
# Earth's: 1 AU is about 23,500 Earth radii
sun = 23500.0
kind = "rocky"
# 1/sqrt 2: the mantle's floor of ADR 0152's grid (the Earth's is 0.55), stated, not derived
iron = 0.7071067811865476
# the inner core a third of the core's radius, as the Earth's
heat = 0.65
# the core 2.4 times the mantle (ADR 0154)
density = [2700.0, 3300.0, 7920.0]
# the sun's mean density, kg/m3 (the real Sun's; real gravity, generation 8): with the radius the sky gives it, its
# mass, which sets every year by Kepler's law; 53,800 gives back the 54-day year of the generations before
sun_density = 1408.0

[[body]]
name = "Luna"
parent = "Terra"
stages = ["crust", "impacts", "ice", "volcanism"]
generator = "hills"
ground = ["regolith", "regolith", "stone"]
air = false
colour = [0.78, 0.77, 0.75]
# the Moon's to the Earth: 3.7 times smaller, 30 Earth diameters away (the developer, 2026-11-11)
size = 3.7
orbit = 60.0
kind = "rocky"
# the Moon's make-up (real gravity, generation 8, ADR 0180): a small core a fifth of her radius, a highland crust,
# a mean of 3340 kg/m3 (the Moon's), so she pulls 0.167 of Terra by her own mass
iron = 0.2
density = [2550.0, 3310.0, 7000.0]
# nearly dead: a thin liquid shell round a solid core
heat = 0.05
# before generation 8: Terra's numbers on her, so she generates and pulls as she did (0162-planet-interior), her rock
# weighed by Terra's pull
[body.old]
iron = 0.7071067811865476
density = [2700.0, 3300.0, 7920.0]
weight_g = 19.62

# Mars (planet-model.md step 5; the name the developer's, 2026-11-19), in the worlds of generation 5 on: a world
# made before keeps Terra and Luna alone. Thin air (about 0.01 atm), no liquid water and its sky's colour wait for
# the runs that read them (`air = false` until then); its ground is its kinds' (data/biomes.toml), this row's
# `ground` only where it has no map.
[[body]]
name = "Mars"
parent = "sun"
since = 5
# a planet's crust without plates (bake/mars.rs): the dichotomy; craters by age; one plate's dead volcanoes and the
# canyon they tore; valleys and outflow channels long dry; polar caps and frost
stages = ["crust", "impacts", "volcanism", "erosion", "ice"]
# the real one's radius is 0.53 of the Earth's; 1.85 gives 3328 columns, 104 chunks (13 x 8, as Luna's 52 is 13 x 4)
size = 1.85
# 1.5 AU in its own radii: Terra's 23500 of hers, times 1.5, times 1.85
sun = 65212.5
# an old surface: it has collected craters as long as Luna's highlands (the impacts stage's share of the power law)
age = 1.0
# the real sol: 24.66 hours to the Earth's 24 (F9 "mars does not rotate"); 420 whole turns a sky's PERIOD
day = 1.0275
generator = "hills"
ground = ["red dust", "mars regolith", "basalt"]
air = false
colour = [1.0, 0.55, 0.36]
kind = "rocky"
# a small core (the real one about half the radius), all solid: its dynamo died, so no field though it turns
iron = 0.5
heat = 0.0
# a basaltic crust, a mantle richer in iron than Terra's, a core of iron with much sulphur
density = [2900.0, 3500.0, 6700.0]

# The gas giant (planet-model.md "Gas planets", step 6a; the working name is the developer's to change), in the
# worlds of generation 6 on. Its size is a real giant's (the developer, 2026-11-18): 11 Terra radii (about 47 km)
# and about 300 Terra masses, so 2.5 times her pull at the cloud tops. Gas has no blocks: no ground, generator,
# stages or grid; the sky's shader draws it (shader_sky_fx.wgsl `giant`). Below the cloud tops is not built: they
# hold a player as a floor (phys `blocked`) until the dive's run.
[[body]]
name = "Jupiter"
parent = "sun"
since = 6
# 1/11: 67584 columns' worth of radius on the 4 km Terra (it has no columns of its own)
size = 0.09090909090909091
# 5 AU in its own radii: Terra's 23500 of hers, times 5, over 11
sun = 10681.818181818182
# a day of 0.4 of Terra's (the real one's 10 hours to the Earth's 24): 1080 whole turns a sky's PERIOD
day = 0.4
air = false
colour = [1.0, 0.9, 0.74]
kind = "gas"
# the conducting fluid (metallic hydrogen) up to 0.8 of the radius; a solid core a tenth of that, 3.7 km, between
# Luna's 1.15 km and Terra's 4.2 km
iron = 0.8
heat = 0.9
# the molecular gas's, again, and the fluid's (the core reckoned at the fluid's): a mean of 1114 kg/m3 (the real
# one's 1326), so 300.7 Terra masses in 11 radii
density = [500.0, 500.0, 1700.0]

# The giant's icy moon (planet-model.md step 6c; the working name is the developer's to change), in the worlds of
# generation 7 on: an old, dark, heavily cratered world of ice and rock, airless, its face to the giant, which hangs
# 14.4 degrees wide in its sky. Luna's family of stages on ice (bake/icy.rs): the old crust; the impacts, with two
# multi-ring basins whose middles the ice flowed flat; the polar frost. No volcanism.
[[body]]
name = "Callisto"
parent = "Jupiter"
since = 7
stages = ["crust", "impacts", "ice"]
# a little under Luna: 6144 / 4 is 1536 columns, 48 chunks (3 x 16, as Terra's 192 are 3 x 64); 1061 m in radius
size = 4.0
# 8 giant radii (the real one's 26.3, brought in so the giant hangs 14.4 degrees wide: real-world logic exaggerated
# for small worlds): 374 km out, 7 radii over the cloud tops, well inside the giant's 7.49 Mm sphere
orbit = 8.0
generator = "hills"
ground = ["dark lag", "dusty ice", "ice"]
air = false
# its point of light: a dark grey-brown
colour = [0.42, 0.38, 0.34]
kind = "icy"
# a rock core to half the radius under a mantle of ice and rock and a crust of dirty ice (the real one is only partly
# differentiated, a mean of 1834 kg/m3); stone cold, all solid: no field
iron = 0.5
heat = 0.0
density = [950.0, 1700.0, 3000.0]
