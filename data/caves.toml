# Cave kinds by rock and formation (docs/design/deep-world.md section 4; schema and checks in
# crates/engine/src/caves.rs). Each row is a kind: where it forms, in which rock, and its shape. A cave of a kind is
# cut only in cells whose rock (`Body::rock`) is one of its `hosts`, in columns of one of its `provinces`: it stops
# where the rock stops. Only a planet with the mantle gets these (ADR 0152); ADR 0063's limestone systems are still
# made in code (caves.rs `make`) below generation 3, where the karst row takes over.
#
# `shape`: "tube" (a lava tube: runs downhill a few metres under the ground, flat floor, arched roof, skylights),
#   "fissure" (a crack along the border between two provinces: narrow and tall, blind or open at the surface) or
#   "karst" (galleries at the water table with sinkholes and halls, below).
# `hosts`: the rocks it may be cut in, block names of `data/rocks.toml`'s layers.
# `provinces`: the provinces it may lie in, names of `data/rocks.toml`.
# `depth`: [m, m] under the ground: its roof at least the first (under the 4 m soil band: a kind is cut in rock), its
#   floor at most the second (a skylight, a
#   trench and an open slot break the roof on purpose).
# `spacing`: one candidate start every this many columns each way on a face; `chance`: the share that grow one.
# `width`, `height`, `length`: [least, most] metres, drawn per cave.
# `generations` (optional): [least, most] of the worlds' generations it is made in (`Body::gen`, ADR
#   0160-generation-number-and-arc-basalt); every generation from 1 when left out. A row's place in the file seeds
#   it: add new rows at the end, and give an old row an end rather than changing it, so older worlds keep theirs.
# Tubes: `skylight` metres between roof collapses open to the sky (at least one a tube), `trench` the chance the
#   stretch at a skylight has fallen in over 20 to 50 m, `branch` the chance a branch leaves, per 100 m.
#   `slope`: the least fall a metre the ground must keep, or the tube ends (lava ran only downhill).
#   From generation 2 a tube is one round passage (caves.rs `round_tube`): `width` waves slowly along it, its
#   lower third is filled flat, so it is two thirds of its width tall (within `height`); it starts high on its
#   basalt and ends where it would come within 3 m of another tube.
# Fissures: `open` the share open at the surface as a slot over part of their length.

[[kind]]
name = "lava tube"
shape = "tube"
hosts = ["basalt"]
provinces = ["rift", "volcanic arc"]
depth = [4.5, 16.0]
spacing = 48
chance = 0.8
width = [3.0, 8.0]
height = [2.5, 5.0]
length = [150.0, 700.0]
generations = [1, 1]
skylight = 200.0
trench = 0.2
branch = 0.3
slope = 0.015

[[kind]]
name = "fissure"
shape = "fissure"
hosts = ["granite", "gneiss", "schist", "quartzite", "andesite", "basalt", "gabbro"]
provinces = ["shield", "basin", "folded belt", "volcanic arc", "rift"]
depth = [4.5, 64.0]
spacing = 256
chance = 0.7
width = [1.0, 2.0]
height = [10.0, 58.0]
length = [80.0, 300.0]
open = 0.35

# Lava tubes from generation 2: one round passage 4 to 7 m wide in the basalt of rifts and of the arcs' flows
# (data/rocks.toml `flow`).
[[kind]]
name = "lava tube"
shape = "tube"
hosts = ["basalt"]
provinces = ["rift", "volcanic arc"]
depth = [4.5, 14.0]
spacing = 40
chance = 0.8
width = [4.0, 7.0]
height = [2.6, 4.7]
length = [150.0, 900.0]
generations = [2, 255]
skylight = 200.0
trench = 0.2
branch = 0.3
slope = 0.008

# Dry karst from generation 3 (0161-karst-caves): rain water dissolved the limestone along its joints and beds
# down to the water table (caves.rs `water_table`). A system is a main passage that runs down the table's slope
# toward the valley or coast it drains to, near-level at or just above the table, with tributary branches up the
# slope; a hall where a branch joins; sinkholes (a bowl in the ground and a shaft down to the passage) where the
# limestone reaches up to the soil. Nothing is cut below the table.
# `width`, `height`: a passage's; `length`: the main passage's (a branch's half of it); `depth`: a passage's floor
# under the ground. `skylight`: metres between sinkholes along a passage at least; `branch` per 100 m;
# `hall`, `hall_height`: a hall's width and height (made smaller, down to the least, where the limestone is too
# thin, else none); `sinkhole`: a bowl's width at the ground; `shaft`: its throat's width.
[[kind]]
name = "karst"
shape = "karst"
hosts = ["limestone"]
provinces = ["basin"]
depth = [7.0, 60.0]
spacing = 160
chance = 0.8
width = [3.5, 6.0]
height = [2.6, 4.0]
length = [250.0, 1200.0]
generations = [3, 255]
skylight = 60.0
branch = 0.8
hall = [10.0, 30.0]
hall_height = [6.0, 15.0]
sinkhole = [9.0, 18.0]
shaft = [3.0, 5.0]
