# A draft body (planet-model.md build step 5a): the Mars-like planet's row, read only by its bake's tests and
# `technoape-server bakemap=data/drafts/bodies-mars.toml body=Mars` (crates/engine/src/bake/mars.rs). It is not in
# data/bodies.toml, so no world has it yet: the reader appends it to bodies.toml's rows. The keys are bodies.toml's
# (its header says what each means); the name is Mars, the developer's call (2026-11-20).
# Only keys a stage reads are set beyond what a row must have: thin air (about 0.01 atm), no liquid water and the
# sky's colour wait for the runs that read them; `air = false` and Luna's ground blocks stand in until then.

[[body]]
name = "Mars"
parent = "sun"
# a planet's crust without plates (bake/mars.rs): the dichotomy; craters by age; one plate's dead volcanoes and the
# canyon they tore; valleys and outflow channels long dry; polar caps and frost
stages = ["crust", "impacts", "volcanism", "erosion", "ice"]
# the real one's radius is 0.53 of the Earth's; 1.85 gives 3328 columns, 104 chunks (13 x 8, as Luna's 52 is 13 x 4)
size = 1.85
# 1.5 AU in its own radii: Terra's 23500 of hers, times 1.5, times 1.85
sun = 65212.5
# an old surface: it has collected craters as long as Luna's highlands (the impacts stage's share of the power law)
age = 1.0
generator = "hills"
ground = ["regolith", "regolith", "stone"]
air = false
kind = "rocky"
# a small core (the real one about half the radius), nearly frozen: no field
iron = 0.5
heat = 0.15
# a basaltic crust, a mantle richer in iron than Terra's, a core of iron with much sulphur
density = [2900.0, 3500.0, 6700.0]
