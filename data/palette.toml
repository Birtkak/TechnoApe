# The one palette every texture and model is painted from (docs/design/studio.md; schema in
# crates/engine/src/palette.rs). `name`: unique, lower case. `rgb`: "#rrggbb", sRGB, the bytes a PNG holds.
# The order here is the order on the Studio's Palette page. `ramp` (optional): the colours with one ramp name
# are a run from dark to light, in this order. Written by the Studio: comments are not kept.

[[colour]]
name = "grass dark"
rgb = "#2a511c"
ramp = "grass"

