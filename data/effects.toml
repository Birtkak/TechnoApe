# The effects (ADR 0031, docs/design/effects.md; schema and checks in crates/client/src/fx.rs). Presentation
# only: the client plays a row where an event happened; nothing in the simulation depends on one.
# `count`: particles per event, times the settings' Particles scale (few 0.5, normal 1, many 2).
# `start`: point (the event's point), block (anywhere in its cell), faces (on its cell's faces).
# `speed`: m/s, from .. to, in a random direction; `up`: m/s more along the body's up.
# `gravity`: times the body's pull (radial, phys::G); `drag`: 1/s.
# `ground`: none, stop (lands and lies), bounce (then lies), die (and plays `then` there).
# `life`: s, from .. to. `size`: the edge in m (for `block`, a share of the cell), from .. to;
# with `grow` it runs from the first to the second over that share of the life, else it is picked between.
# `shrink`: the last share of the life over which it shrinks to nothing (its fade).
# `look`: debris (a small cube of the block's own texels), square (a flat square facing the camera, in
# `colour`), block (the whole cell, its texels exactly as the terrain draws them).
# `spin`: rad/s at most.
# Since ADR 0050 (docs/design/studio-tools.md "Effects"; every field optional, a row without them draws as before):
# `rate`: particles a second for as long as it plays (`Fx::start` .. `stop`, a model state's effects, fxplay=);
# `count` is then what bursts at its start (0 for none). A row needs a count, a rate or both.
# `start` also: ring (on a circle of `radius` m, flat on the ground), cone (at the point, flying out within
# `angle` degrees of `dir`, x, y up, z of the event's frame, default up), box (anywhere in `box` = [x, y up, z] m).
# `gradient`: colour over life, [[share of the life, "palette name"], ...] in order, in place of `colour`
# (squares and textures). `size_curve`, `bright_curve`: [[share, times], ...], straight between the points.
# `noise = { strength, scale, speed }`: a push of up to `strength` m/s² through a smooth noise field of grain
# `scale` m sliding at `speed` grains a second (flames lick, smoke curls). `rise`: m/s² up; `spread`: m/s²
# sideways, each particle its own way (a plume widens).
# `glow`: 0..8, the particle's own light times its colour; a lasting row that glows is also a lamp where it plays
# (lit and shadowed as the lamps are, flickering when it has noise).
# `look` also: model (`model` = a file of data/models/, drawn at `size` times its own size, resting on its foot),
# texture (`texture` = a block: its top face, painted in data/textures/ or its pattern, times the gradient).
# `face` (squares, textures, models): camera (default), flight (along its flight, a streak of a 30th of a second;
# a model's y along it), tumble (turning about an axis of its own at `spin`).
# [[group]] name, rows = [...]: several rows played and stopped as one (fire = flames + embers + smoke).
# The file is read again within a second of a change in a running game; a refused one is named on stderr and
# the rows before stay.

[[effect]]
name = "break"
count = 12
start = "block"
speed = [0.8, 2.2]
up = 1.6
drag = 0.4
ground = "bounce"
life = [1.4, 2.2]
# a debris cube shows 2 x 2 of the block's texels a side: 12.5 cm at 16 texels to a 1 m block (ADR 0033)
size = [0.1, 0.18]
shrink = 0.3
look = "debris"
spin = 9.0

[[effect]]
name = "place"
count = 6
start = "faces"
speed = [0.2, 0.6]
gravity = 0.3
life = [0.2, 0.35]
size = [0.04, 0.07]
shrink = 0.6
look = "debris"

# the block itself, growing into place over the real one while its mesh is late on purpose (play.rs)
[[effect]]
name = "grow"
count = 1
start = "point"
gravity = 0.0
life = [2.0, 2.0]
size = [0.9, 1.0]
grow = 0.05
look = "block"

# the water's droplets over a fall or a front (water.rs), and their splash where they land
[[effect]]
name = "spray"
count = 1
start = "point"
ground = "die"
life = [2.0, 2.0]
size = [0.06, 0.06]
look = "square"
colour = [0.75, 0.86, 0.95]
then = "splash"

[[effect]]
name = "splash"
count = 3
start = "point"
speed = [1.5, 1.5]
up = 0.8
ground = "die"
life = [0.6, 0.6]
size = [0.05, 0.05]
look = "square"
colour = [0.75, 0.86, 0.95]

# a survival dig's hit (ADR 0034): a few chips off the block's faces, every quarter second held
[[effect]]
name = "chip"
count = 3
start = "faces"
speed = [0.6, 1.4]
up = 0.9
drag = 0.4
ground = "bounce"
life = [0.35, 0.6]
size = [0.05, 0.09]
shrink = 0.5
look = "debris"
spin = 9.0

