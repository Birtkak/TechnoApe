# The rock under the soil (W4, ADR 0063; schema and checks in crates/engine/src/rock.rs). The bake gives every
# 8 m map cell a province from what the plates did there (crates/engine/src/bake/rock.rs); the rows here are
# those provinces, in the bake's order, and their names must match it.
# `layers`: the province's rocks top down, each [block, metres]. The first layer's top lies `datum` metres
# over the sea (and above it the first layer goes on up to the soil); the last layer's metres are 0: it goes
# to the bottom of the crust (about 192 m), where the mantle takes over. A valley cuts down through the layers, and a cliff shows their bands.
# `fold`: [metres, wavelength in metres]: how far the layers wave up and down and how wide the waves are.
# `heat`: how much warmer the rock is a metre deeper at the top, degrees C (the year's mean air at the surface on top);
# from generation 11 deeper down the sphere's steady conduction from it, heat R d / (R - d) (`Body::geotherm`).
# `caves`: "limestone" (water-cut systems along the water table, where limestone holds it), "tubes" (lava
# tubes a few metres under basalt ground: a rift's, or an island's of oceanic crust) or "none".
# `flow` (optional; worlds of generation 2 on, ADR 0160-generation-number-and-arc-basalt): lava flows lying over
# the province's layers: `rock` from the ground down `thick` metres, over about `share` of its ground, in fields some
# `width` metres across (patchy, by the seed). A real arc volcano is andesite and tuff with basalt flows down its
# flanks (the Cascades' Lava Beds, Etna); the flows are where its lava tubes run (data/caves.toml).

datum = 60.0
# The weight over a point (`Body::pressure`, MPa) is the rock and water above it with the gravity inside the
# body (ADR 0152), and 1 atmosphere at the ground; the rock's densities are the body's (data/bodies.toml).

# The mantle under the crust, on a planet whose grid goes down through it (ADR 0152; ADR 0158).
# Each [[mantle.rock]] takes over, going down, where the pressure of the column at
# sea level (the same at a radius under hill and sea: isostasy) reaches `pressure` MPa at `heat` C, and `slope`
# MPa more for each degree the column is warmer there (a phase boundary's Clapeyron slope: over 0 a hot province
# has it deeper, under 0 shallower). The heat is the province's (`heat` a metre under the year's mean air). The
# first row ends the crust; rows go down in order. `wobble`: metres every boundary waves by, slowly, by the seed.
[mantle]
wobble = 4.0

# The crust's floor, about 192 m down: thinner under hot rifts and arcs, thicker under the cold shields.
[[mantle.rock]]
block = "peridotite"
pressure = 10.07
heat = 42.0
slope = -0.04

# The transition zone (olivine turned spinel): deeper where it is hot.
[[mantle.rock]]
block = "ringwoodite"
pressure = 33.0
heat = 95.0
slope = 0.03

# The lower mantle down to the floor (ringwoodite broken down to perovskite): shallower where it is hot.
[[mantle.rock]]
block = "bridgmanite"
pressure = 56.7
heat = 148.0
slope = -0.03

[[province]]
name = "shield"
layers = [["granite", 80.0], ["gneiss", 0.0]]
fold = [3.0, 500.0]
heat = 0.12
caves = "none"

[[province]]
name = "basin"
layers = [["sandstone", 25.0], ["shale", 15.0], ["limestone", 45.0], ["granite", 0.0]]
fold = [6.0, 700.0]
heat = 0.15
caves = "limestone"

[[province]]
name = "folded belt"
layers = [["slate", 25.0], ["marble", 15.0], ["quartzite", 20.0], ["schist", 50.0], ["gneiss", 0.0]]
fold = [28.0, 180.0]
heat = 0.18
caves = "none"

[[province]]
name = "volcanic arc"
layers = [["tuff", 20.0], ["andesite", 90.0], ["granite", 0.0]]
fold = [8.0, 300.0]
heat = 0.35
caves = "none"
flow = { rock = "basalt", share = 0.5, thick = 30.0, width = 700.0 }
# A live volcano's chamber (worlds of generation 10 on, docs/design/volcanoes.md): held at this heat, C, by the melt
# rising from the sinking plate; the rock round it is warmer by conduction, (chamber - far) * R / r. An arc's
# andesite melt is about 1000 to 1200 C; it must be over lava's freeze point (data/fluids.toml).
chamber = 1150.0
# How a live chamber erupts (docs/design/volcanoes.md "Eruptions", World::erupt): melt arrives from below at `supply`
# chamber volumes a game year; the chamber's overpressure is `bulk` (MPa: the melt's and the chamber walls' stiffness
# together, about 1 GPa for a melt with gas bubbles in it) times the melt over its rest over its volume; past `plug`
# (MPa: what the frozen plug in the conduit and the rock round it bear, some 10 MPa, rock's tensile strength) the
# conduit opens and the melt over its rest pours from the crater at `effuse` m3/s (a small basaltic eruption's) until
# it is spent. So an eruption is plug / bulk = 1 % of the chamber (64 m3 on the small planet, 1,650 on the 4 km one;
# real chambers give some 0.1 %, exaggerated as the landforms are) and comes every plug / bulk / supply = 3 game years.
# shortcut: `supply` stands in for the mantle's melt supply under the arc (a share of the chamber's volume, so a larger
# chamber is fed more), until a melt supply rule from the interior.
eruption = { supply = 0.003333, plug = 10.0, bulk = 1000.0, effuse = 1.0 }

[[province]]
name = "rift"
layers = [["basalt", 70.0], ["gabbro", 0.0]]
fold = [4.0, 400.0]
heat = 0.35
caves = "tubes"

[[province]]
name = "ocean floor"
layers = [["basalt", 50.0], ["gabbro", 0.0]]
fold = [3.0, 600.0]
heat = 0.2
caves = "tubes"

# Luna's (0165-bake-stages; a world of generation 4 on). `body`: the row of data/bodies.toml whose ground a
# province is, Terra's (the home's) when not given. Luna has no plates: her provinces are read from the kinds of
# ground her bake laid (crates/engine/src/bake/luna.rs `province`). Under her dust (the biomes' band) lies her
# old pale crust, anorthosite, down to the bottom. The maria are basalt that flooded the basins facing Terra, a
# fill about 40 m deep under the mare's ground (the datum, 60 m, less 60 m) over the anorthosite it filled. The
# thorium province round the largest mare is KREEP rock, some 20 m under the dust, over the anorthosite. A cold,
# dead body: little heat with depth. Her ores and caves are rows of minerals.toml and caves.toml that name these
# provinces (0166-luna-ore-and-caves); `caves` here is the home's old worms' and stays "none".
[[province]]
name = "highland crust"
body = "Luna"
layers = [["anorthosite", 0.0]]
fold = [2.0, 400.0]
heat = 0.02
caves = "none"

[[province]]
name = "mare"
body = "Luna"
layers = [["mare basalt", 60.0], ["anorthosite", 0.0]]
fold = [2.0, 400.0]
heat = 0.02
caves = "none"

[[province]]
name = "kreep terrane"
body = "Luna"
layers = [["kreep", 45.0], ["anorthosite", 0.0]]
fold = [2.0, 400.0]
heat = 0.02
caves = "none"
