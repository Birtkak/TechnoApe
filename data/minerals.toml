# The ore bodies a planet holds (W4, ADR 0063; schema and checks in crates/engine/src/ore.rs), from
# docs/design/ore-budget.md: its numbers kept per block (the developer's call), so a body has the blocks the
# budget names and an ore block gives 1 to 3 ingots, the most at a body's middle.
# Each [[kind]] is a kind of body:
# `block`: the ore block (data/blocks.toml); `gives`: the element the ledger counts it as.
# `shape`: lump (a rounded body), vein (tall and two metres thin), seam (a flat bed 2 m thick), layer (3 m),
#   blanket (1 m, just under the ground), cap (the stained top of a body, at the ground), bog (1.5 m in a wet
#   soil), gravel (1.5 m in a stream bed). `count` bodies of `blocks` each, on the 4 km planet (scaled by area
#   on other sizes, at least one); `depth` [min, max]: metres from the ground to a body's middle.
# `provinces`: where it forms (data/rocks.toml); `host`: the rock that must be at its middle (optional);
# `biomes`: the biomes it forms under (optional; bog iron and bauxite follow the climate, not the rock).
# `near`: [min, max] metres from the spawn the nearest body must lie (optional; ore-budget.md, "Where").
# `gravel`: a kind of gravel body put in the stream bed below each body, when a stream runs within 300 m.
# `gossan`: rusty ground over each body, that many metres across (a sign of a deep body).

[[kind]]
name = "copper gravel"
block = "copper gravel"
gives = "copper"
shape = "gravel"
count = 40
blocks = 500
depth = [0.75, 0.75]
provinces = ["shield", "basin", "folded belt", "volcanic arc", "rift"]
near = [0.0, 150.0]

